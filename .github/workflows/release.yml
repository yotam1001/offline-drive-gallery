name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test OfflineDriveGallery.slnx -c Release
      - run: dotnet clean OfflineDriveGallery.slnx -c Release -v:q
      - run: dotnet publish src/OfflineDriveGallery/OfflineDriveGallery.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o artifacts/publish
      - name: Package and checksum
        shell: pwsh
        run: |
          Compress-Archive -Path artifacts/publish/* -DestinationPath artifacts/OfflineDriveGallery-win-x64.zip
          $hash = (Get-FileHash artifacts/OfflineDriveGallery-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  OfflineDriveGallery-win-x64.zip" | Set-Content artifacts/SHA256SUMS.txt -Encoding ascii
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME artifacts/OfflineDriveGallery-win-x64.zip artifacts/SHA256SUMS.txt --generate-notes --verify-tag
